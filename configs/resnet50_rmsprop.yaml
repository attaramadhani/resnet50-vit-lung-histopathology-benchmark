scenario_id: 2
experiment_name: resnet50_rmsprop
model_label: ResNet50
architecture: resnet50
model_loader: torchvision
pretrained_weights: ResNet50_Weights.IMAGENET1K_V2
dropout: 0.3 (classifier head)
frozen_blocks: none
img_size: 224
num_classes: 3
normalization_mean: [0.485, 0.456, 0.406]
normalization_std: [0.229, 0.224, 0.225]
split_protocol: standard_image_level
n_folds: 5
batch_size: 32
epochs: 50
early_stopping_patience: 5
early_stopping_min_delta: 0.0
early_stopping_monitor: val_loss
optimizer: RMSprop
learning_rate: 0.0001
weight_decay: 0.0001
momentum: 0.0
lr_scheduler: none
grad_clip: none
fp16_mixed_precision: true
use_augmentation: true
augmentation_ops: [RandomHorizontalFlip(p=0.5), RandomRotation(20), RandomAffine(scale=(0.9,1.1), shear=10), ColorJitter(brightness=0.2, contrast=0.2)]
seed: 42 (re-seeded per fold)
